<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vuln Agent</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <project-list v-if="route === 'projects'"></project-list>
  <dashboard v-else-if="route === 'dashboard'" :project-name="routeParams.name" :active-stage="routeParams.stage" :active-file-id="routeParams.fileId"></dashboard>
  <div v-if="toast.show" class="toast">{{ toast.msg }}</div>
  <run-dialog v-if="runDialog.show" :project-name="runDialog.projectName" @close="runDialog.show=false" @started="onRunStarted"></run-dialog>
</div>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="app.js"></script>
</body>
</html>
