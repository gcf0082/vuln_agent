# analysis-config.yaml
# Controls which analysis stages are executed.
# Set false to skip a stage and use existing products.

# Whether to decompile jar/war/class files
decompile: false

# Whether to analyze bytecode directly (javap/ASM)
bytecode_analysis: false

# Whether to collect and analyze attack surfaces
attack_surface_collection: true

# Whether to perform vulnerability analysis
vulnerability_analysis: true

# Whether to re-analyze confirmed VULNs for business-context validation
vuln_re_analysis: false

# Whether to allow access to sibling directories when tracing code
allow_sibling_access: true

# Whether to run vulnerability analysis planning (analyzes surfaces and classifies risk level before deep analysis)
vuln_planning: true

# Max concurrent threads for parallel analysis stages
max_workers: 3

# Max concurrent threads for vulnerability analysis (separate pool)
vuln_workers: 5

# Timeout for surface discovery stage (minutes)
timeout_surface_discover: 120

# Timeout for other analysis stages (minutes)
timeout_default: 60

# Skip review for NOVULN findings (saves LLM calls)
skip_novuln_review: true
